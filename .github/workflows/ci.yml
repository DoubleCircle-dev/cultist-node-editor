name: CI

# 只做测试（发布不在 CI 里做：打包成 vsix 由维护者手动执行并手动上架）
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 覆盖 xvfb 路径；Windows 覆盖开发机常见环境
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # @vscode/test-cli 会把 VS Code 归档下到工作区的 .vscode-test/
      # （首次约 100MB+，本机实测完整目录 1GB），缓存下来能省掉大部分时间
      - name: 缓存 VS Code 归档
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ hashFiles('.vscode-test.mjs') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-

      # lint + 前端单测（43 项）；vite 分支的 verify 里还会先 build:ui
      - name: 静态检查与前端单测
        run: pnpm run verify

      # 扩展宿主集成测试：会真的拉起一个 VS Code
      - name: 扩展宿主集成测试（Windows / macOS）
        if: runner.os != 'Linux'
        run: pnpm test

      - name: 扩展宿主集成测试（Linux，需要 xvfb）
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test
