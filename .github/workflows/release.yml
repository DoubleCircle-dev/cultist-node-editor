name: Release

# 打 tag（v*）时：先跑完整 CI，再打包 vsix 并自动挂到 GitHub Release。
# ⚠️ 仍然「只打包、不发布」：CI 里没有任何 Marketplace 凭据，
#    上架由维护者从 Release 下载 vsix 后手动完成。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release / 上传资产需要

jobs:
  # 复用 ci.yml：tag 指向的提交必须先通过完整的测试矩阵
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # tag 与 package.json 的 version 必须一致：vsix 文件名取自 package.json，
      # 不一致的话 Release 上的资产会与 tag 对不上
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag($TAG) 与 package.json($VER) 不一致"
            exit 1
          fi

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # vsce package 会先执行 vscode:prepublish ——
      # vite 分支据此构建 frontend/dist，vanilla 分支（core）无需构建
      - name: 打包 vsix
        run: pnpm run package:vsix

      - name: 产出信息
        run: ls -lh ./*.vsix

      - name: 挂到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 形如 v0.1.0-beta.1 的 tag 自动标为 prerelease
          case "$TAG" in
            *-*) PRE="--prerelease" ;;
            *)   PRE="" ;;
          esac
          gh release create "$TAG" ./*.vsix \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $PRE
