name: Release

# 发布模型：**master 是发布线** —— 谁被合并进 master，就发布谁。
#   1. 把要发布的前端线合并进 master（只合前端线；core 是纯后端，由 CI 里的同步步骤补进来）
#   2. 在 master 上打 tag（tag 版本号必须与 package.json 的 version 一致）
#   3. 本工作流校验「tag 确实落在 master 上」→ 跑完整 CI → 打包 vsix → 挂 GitHub Release
#
# ⚠️ 仍然「只打包、不上架」：CI 里没有任何 Marketplace 凭据，
#    上架由维护者从 Release 下载 vsix 后手动完成。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release / 上传资产需要

jobs:
  # 廉价的前置闸门：不通过就**不会**触发后面的完整 CI（避免白跑 ubuntu+windows）
  guard:
    name: 前置校验（tag 落在 master 上 + 版本号一致）
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— 判断祖先关系需要完整历史
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验 tag 指向的是 master 上的提交
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag ${GITHUB_REF_NAME} 指向的提交不在 master 上；发布只走 master（先把改动合并进 master，再在 master 上打 tag）"
            exit 1
          fi
          echo "✅ tag ${GITHUB_REF_NAME} 落在 master 上"

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag($TAG) 与 package.json($VER) 不一致（vsix 文件名取自 package.json）"
            exit 1
          fi

  # 复用 ci.yml：完整测试矩阵跑在 master 的那个提交上
  ci:
    name: 完整测试
    needs: guard
    uses: ./.github/workflows/ci.yml

  release:
    name: 打包并挂 Release
    needs: [guard, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 前端线不跟踪后端代码（见 .gitignore）：打包前同样要把 core 同步进来
      - name: 同步后端（core → 本工作区）
        run: |
          git clone --depth 1 --branch core https://github.com/${{ github.repository }}.git "${{ runner.temp }}/cne-core"
          node "${{ runner.temp }}/cne-core/scripts/sync-backend.mjs" "${{ github.workspace }}"

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # vsce package 会先执行 vscode:prepublish ——
      # vite 那套前端据此构建 frontend/dist，vanilla 方案无需构建
      - name: 打包 vsix
        run: pnpm run package:vsix

      - name: 产出信息
        run: ls -lh ./*.vsix

      - name: 挂到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 形如 v0.1.0-beta.1 的 tag 自动标为 prerelease
          case "$TAG" in
            *-*) PRE="--prerelease" ;;
            *)   PRE="" ;;
          esac
          gh release create "$TAG" ./*.vsix \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $PRE
