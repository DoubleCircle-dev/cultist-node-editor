<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>节点编辑器</title>

        <!--
            样式与脚本都交给 Vite（入口见 src/main.js），这里不再手写资源列表。

            #app 里的**静态骨架**有两个作用：
              1. 脚本尚未执行时先有结构，不白屏；
              2. 扩展宿主的集成测试断言这些 id 存在（test/extension.test.js 里的 canvas-basic / canvas-viewport）。
            Vue 挂载后会把 #app 的内容整体替换成组件渲染的结果。
        -->
    </head>
    <body>
        <div id="app">
            <div class="container">
                <div class="canvas-container" id="canvas-basic">
                    <div class="canvas-viewport" id="canvas-viewport"></div>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
